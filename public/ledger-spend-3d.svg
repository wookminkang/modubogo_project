      <stop stop-color="#E0384A"/>
      <stop offset="1" stop-color="#A11226"/>
    </linearGradient>
    <linearGradient id="sCoinTop" x1="16" y1="18" x2="48" y2="42" gradientUnits="userSpaceOnUse">
