<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- 입금: 3D 파란 코인 + 들어오는 화살표 -->
  <defs>
    <linearGradient id="dCoinSide" x1="14" y1="30" x2="50" y2="54" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2B5FE3"/>
      <stop offset="1" stop-color="#14309B"/>
    </linearGradient>
    <linearGradient id="dCoinTop" x1="16" y1="18" x2="48" y2="42" gradientUnits="userSpaceOnUse">
      <stop stop-color="#8FB6FF"/>
      <stop offset="1" stop-color="#3D74F0"/>
    </linearGradient>
    <linearGradient id="dArrow" x1="32" y1="6" x2="32" y2="26" gradientUnits="userSpaceOnUse">
      <stop stop-color="#7DF0C0"/>
      <stop offset="1" stop-color="#1FBF83"/>
    </linearGradient>
    <radialGradient id="dShadow" cx="0" cy="0" r="1" gradientTransform="translate(32 57) scale(19 4)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#14309B" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#14309B" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <ellipse cx="32" cy="57" rx="19" ry="4" fill="url(#dShadow)"/>
  <!-- 코인 옆면(두께) -->
  <path d="M12 38v6c0 5.5 9 10 20 10s20-4.5 20-10v-6H12z" fill="url(#dCoinSide)"/>
  <!-- 코인 윗면 -->
  <ellipse cx="32" cy="38" rx="20" ry="10" fill="url(#dCoinTop)"/>
  <ellipse cx="32" cy="38" rx="14" ry="6.4" fill="#FFFFFF" fill-opacity="0.22"/>
  <!-- 원화 심볼 -->
  <g stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M26 35.2l2 5.4 4-4.4 4 4.4 2-5.4"/>
    <path d="M25.6 37.4h12.8"/>
  </g>
  <!-- 들어오는 화살표(아래 방향) -->
  <path d="M32 6a3.4 3.4 0 0 1 3.4 3.4v6.2h3.8c1.5 0 2.3 1.8 1.2 2.8l-7.2 7a3.1 3.1 0 0 1-4.4 0l-7.2-7c-1.1-1-.3-2.8 1.2-2.8h3.8V9.4A3.4 3.4 0 0 1 30 6h2z" fill="url(#dArrow)"/>
  <path d="M28.6 9.4A3.4 3.4 0 0 1 32 6a3.4 3.4 0 0 0-3.4 3.4v6.2h1.2V9.4h-1.2z" fill="#FFFFFF" fill-opacity="0.35"/>
